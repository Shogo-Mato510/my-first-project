<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #1a1a1a;
      background: linear-gradient(160deg, #f0f4f8 0%, #e8eef5 100%);
    }

    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem 1.75rem;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .tagline {
      margin: 0 0 1.75rem;
      font-size: 1rem;
      color: #475569;
    }

    section {
      margin-bottom: 1.5rem;
    }

    section:last-of-type {
      margin-bottom: 0;
    }

    h2 {
      margin: 0 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
    }

    p {
      margin: 0;
    }

    ul {
      margin: 0;
      padding-left: 1.25rem;
    }

    li {
      margin-bottom: 0.35rem;
    }

    li:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <h1>Shoma</h1>
      <p class="tagline">コードとAIで作るものを楽しみながら学んでいます。</p>

      <section>
        <h2>学習中</h2>
        <p>AIコーディング（Cursor・Claudeなど）を学習中です。</p>
      </section>

      <section>
        <h2>趣味</h2>
        <ul>
          <li>読書（技術書やエッセイ）</li>
          <li>散歩・軽いジョギング</li>
          <li>写真を撮ること</li>
        </ul>
      </section>
    </article>
  </main>
</body>
</html>
